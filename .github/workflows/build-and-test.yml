name: Build and Test

on:
  pull_request:
    branches: [ master,development ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    container: maven:3.9.6-eclipse-temurin-17
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Cache Maven dependencies
      uses: actions/cache@v3
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2

    - name: Verify Java and Maven versions
      run: |
        java -version
        mvn -version

    - name: Create Firebase Config File
      run: echo "${{ secrets.FB_CONFIG }}" > ./firebase-config.json

    - name: Debug file content
      run: |
          echo "--- Listing files to confirm creation ---"
          ls -l
          echo "--- Displaying file content (first 100 chars) ---"
          head -c 100 ./firebase-config.json
          echo ""
          echo "--- End of file content ---"

    - name: Run tests (includes compilation)
      run: mvn clean test
      env:
        FB_CONFIG_PATH: ./firebase-config.json

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: target/surefire-reports/


    - name: Display build summary
      run: |
        echo "✅ Build completed successfully!"
        echo "📦 JAR file created:"
        ls -la target/*.jar || true
