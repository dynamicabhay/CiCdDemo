# hikari the shikari properties
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.validation-timeout=5000

# rate limiting properties
rate.limit.shorten.window.size=86400
rate.limit.shorten.allowed.requests=50
rate.limit.redirection.window.size=60
rate.limit.redirection.window.allowed.requests=50

id.range.increment.window.size=100000