server.domain=tiny-lane.duckdns.org:8081
server.port = 8080
total.api.request.allowed=5
fb.config.path=${FB_CONFIG_PATH:/Users/abhay/google/firebase/tiny-lane-config.json}

spring.profiles.active=dev
